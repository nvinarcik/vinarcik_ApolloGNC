# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@vinarcik/apollo-gnc-method"
  version: 0.3.1
  title: Vinarcik Apollo GNC
  description: A method for modeling spacecraft guidance, navigation and control (GNC) hardware and flight software, with editor templates, SHACL shapes and a component impact report generator.

# source folders
sources:
  - src

# oml server settings
# By default the server binds a free port chosen by the OS (the actual port is
# reported by 'oml list'), so multiple workspaces never collide. Uncomment to
# pin a fixed port instead — but make sure no other workspace uses the same one.
# server:
#   port: 8080

# packing settings: only the reusable method goes into the package
pack:
  - include: [src/method]

# Default CLI arguments per command, injected before your own (so you can override them on the
# command line). Works for any oml command; key by command name. For example:
# defaults:
#   export: -o build/owl
#   reason: -o build/owl -t
defaults:
  render: -m src/model/md -b build/web -c src/model/oml/www.example.com/apollo-cm-gnc/project/bundle.oml
  pack: -o build/dist
